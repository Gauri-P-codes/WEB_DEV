<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caramel&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Chalkduster, fantasy;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: aquamarine;
        font-family: "Caramel";
        font-size: 50px;
      }
      .card {
        background-color: rgb(75, 205, 114);
        border: 2px solid black;
        border-radius: 5px;
        padding: 30px;
        width: 300px;
      }
      h2 {
        padding: 10px;
        text-align: center;
        
        margin:0;
      }
      input {
        padding: 10px;
        border: 2px solid black;
        border-radius: 5px;
        margin-bottom: 10px;
        width: 300px;
        background-color: green;
        color:aliceblue
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      button {
        width: 100px;
        font-family: "Caramel";
        font-weight: 100;
        font-size: 20px;
      }
      button:hover
      {
        background-color: rgb(6, 232, 6);
      }
      ::placeholder{
        color:aliceblue
      }
    </style>
  </head>
  <body>
    <div class="card">
      <form>
        <h2>Sign Up</h2>
        <input type="text" name="" id="" placeholder="Enter First Name" />
        <input type="text" name="" id="" placeholder="Enter Last Name" />
        <input type="email" name="" id="" placeholder="Enter email" />
        <input type="password" name="" id="" placeholder="Enter password" />
        <button>Sign Up</button>
      </form>
    </div>
  </body>
</html>
