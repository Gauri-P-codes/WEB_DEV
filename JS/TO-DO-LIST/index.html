<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h2>TO DO LIST</h2>
      </div>
      <div class="input-container">
        <form>
          <input
            id="input-text"
            type="text"
            placeholder="What do you have in your mind today?"
          />
          <!--make type as button, because everytime the page refreshes and array
          used to clear itself in initial stages-->
          <button id="add-task-btn">Add Task</button>
        </form>
      </div>
      <div class="list-container">
        <ul id="to-do-list"></ul>
      </div>
    </div>
    <script src="script2.js"></script>
  </body>
</html>
