<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-pink-600 flex justify-center items-center
  min-h-screen">
    <div class="bg-white flex flex-col justify-center
    items-center p-8 rounded-lg shadow-lg max-w-sm w-full">
      <h1 class="text-center text-3xl text-pink-400
      mb-6 font-bold">LOGIN</h1>
      <form class="w-full">
        <div class="mb-4">
          <label for="email"
          class="block text-sm font-medium mb-3 text-left">Email</label>
          <input class= "w-full px-3 py-2 bg-gray-200
          border-black focus:outline-indigo-50 focus:ring-2
          focus:ring-blue-950" type="email" name="" id="" placeholder="Email" />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-3" for="password">Password</label>
          <input class= "w-full px-3 py-2 bg-gray-200
          border-black focus:outline-indigo-50 focus:ring-2
          focus:ring-blue-950" 
          type="password" name="" id="" placeholder="Password" />
        </div>
        <button class="w-full bg-pink-400 text-white mb-4 p-1 rounded-md
        hover:bg-pink-500 shadow-2xl
        " type="submit ">Login</button>
      </form>
    </div>
  </body>
</html>
